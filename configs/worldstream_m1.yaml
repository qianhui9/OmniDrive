# Provisional thresholds, NOT calibrated or claimed optimal. Units in comments.
enabled: true
execution_mode: observe_only
storage_device: cpu
max_anchors: 512
max_state_age_s: 1.0           # seconds since actual geometry computation
max_frame_gap_s: 1.0          # seconds; larger gaps reset
association_gate_m: 2.0       # object centre Euclidean distance, metres
map_gate_m: 1.0               # arc-length sampled curve mean distance, metres
map_direction_cos: 0.8        # absolute endpoint direction cosine
box_size_ratio: 2.0           # largest corresponding dimension ratio
residual_threshold: 0.18      # mean absolute normalized descriptor residual
descriptor: normalized_gray
descriptor_size: 16           # spatial samples per crop side
min_texture_std: 0.02         # grayscale std on [0, 1]
min_coverage: 0.9             # fraction of projected rectangle within image/support
min_region_area_px: 64        # pixels squared
search_radius_px: 4           # cap of bounded integer shift search, pixels
search_step_px: 2             # pixels
uncertainty_px: 2.0           # minimum projection search uncertainty, pixels
velocity_uncertainty_mps: 2.0 # assumed uncertainty, metres/second
max_camera_skew_s: 0.01       # tolerated skew without camera-time pose
require_visibility_evidence: true # unknown occlusion => Invalid by default
trust_detection_velocity: false   # finite network velocity alone is not reliability evidence
association_ambiguity_margin_m: 0.0 # reject exact ties; positive margin needs independent scene calibration
association_history_limit: 16
pending_timeout_s: 60.0
min_detection_score: 0.3      # sigmoid detection acceptance for commit, provisional
min_map_score: 0.3            # sigmoid map acceptance for commit, provisional
occlusion_overlap_fraction: 0.1 # projected overlap fraction triggering conservative rejection
occlusion_depth_margin_m: 0.5 # depth difference for potentially nearer occluder, metres
novelty_threshold: 0.18       # local geometry-supported descriptor change residual
novelty_cell_px: 32           # conservative invalidation region tiling
full_refresh_interval: 10     # committed frames, hint only
capture_tensors: false
capture_backbone: false
max_tensor_bytes: 16777216    # hard retained tensor budget, bytes
model_id: unspecified
calibration_path: null
logging: true
log_path: outputs/module1/observe.jsonl
visualization: true
profiling: true
